study:
  name: phase7cr1_short_horizon_thermal_safety_supervisor

sources:
  phase7cr0_config: configs/phase7cr0_diagnostics.yaml
  phase7b1b_config: configs/phase7b1b_voltage_safety_layer.yaml
  frozen_artifacts:
    configs/phase7cr0_diagnostics.yaml: d317c7a8c4250ade68dad2495cdcaa9de7aa1e588be39cae3e9a68687b0e31b5
    src/battery_fast_charge/phase7cr0_runner.py: ccddfd1aab695e4ec18f75fec78cf7d08bcc66a1e60ecabe134716b559ac1f97
    outputs/phase7cr0_diagnostics/metrics.json: 930b258af669f8add4e9cc5de4516f1b2e807f91ecd9b247051c5abf2098317f
    data/phase7cr0_diagnostics/constant_current_trajectories.csv: 1b914b23091d09c3fbb5f2bae4717f5cd6911d77220ffbbb0559a7639b7af78a
    data/phase7cr0_diagnostics/validated_oracle_trajectories.csv: 2c1a7e8c12f5ea87c543c389e8ac909ac60c785f737a1eb837f224ae145c3107

thermal_supervisor:
  ambient_temperature_c: 30.0
  maximum_average_temperature_c: 35.0
  prediction_horizon_steps: 60
  prediction_horizon_s: 300.0
  future_current_policy: constant_candidate
  braking_floor_current_a: 0.0
  temperature_guard_c: 0.10
  # Retained from R0 as a diagnostic reference; the strict supervisor uses
  # the more conservative constant-candidate policy above.
  sustainable_current_a: 3.0
  current_search_tolerance_a: 1.0e-3
  empty_interval_tolerance_a: 1.0e-9
  surrogate:
    coefficient_i2_c_per_step_a2: 0.0026207234161263596
    coefficient_i_c_per_step_a: 0.003211022025391298
    coefficient_temperature_c_per_step_c: -0.0062416491593207555
    intercept_c_per_step: -0.0020991403920301095

teacher_repair:
  retry_on_failure: true
  compare_alternative_on_slew_boundary: true
  slew_boundary_tolerance_a: 1.0e-4
  alternative_start: previous_current_constant
  objective_comparison_tolerance: 1.0e-10

development:
  trajectory_count: 8
  design_start_index: 901
  design_seed: 20260729
  initial_soc_bounds: [0.45, 0.70]
  initial_v1_bounds_v: [0.0, 0.06]
  initial_v2_bounds_v: [0.0, 0.09]
  initial_previous_current_bounds_a: [0.0, 10.0]
  initial_voltage_margin_v: 0.005
  maximum_workers: 3
  maximum_steps: 1800
  target_soc: 0.7995

gates:
  maximum_voltage_v: 4.200001
  maximum_average_temperature_c: 35.0
  maximum_current_step_a: 2.0
  minimum_target_reach_fraction: 1.0
  maximum_empty_interval_count: 0
  maximum_solver_failure_count: 0
  maximum_sustained_oscillation_count: 0
  numerical_tolerance: 1.0e-9

output:
  data_directory: data/phase7cr1_thermal_supervisor
  result_directory: outputs/phase7cr1_thermal_supervisor
