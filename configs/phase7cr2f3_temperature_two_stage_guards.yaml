study:
  name: phase7cr2f3_temperature_two_stage_guards
  phase: Phase 7C-R2F3
  contract_status: preregistered_before_new_state_generation

sources:
  phase7cr2f_config: configs/phase7cr2f_teacher_selection_voltage_guard.yaml
  phase7cr2f2_config: configs/phase7cr2f2_two_stage_voltage_guard.yaml
  phase7cr2f2_freeze_manifest: outputs/phase7cr2f2_two_stage_voltage_guard/freeze_manifest.json
  phase7cr2f2_freeze_manifest_sha256: 62b361f43ed4a51d6c6aea17accb70f1aa2924bdce7006bf288ae464280755a7
  phase7cr2f2_development_states: data/phase7cr2f2_two_stage_voltage_guard/development_initial_states.csv
  phase7cr2f2_internal_states: data/phase7cr2f2_two_stage_voltage_guard/internal_validation_initial_states.csv
  phase7cr2f2_frozen_guards: data/phase7cr2f2_two_stage_voltage_guard/frozen_two_stage_voltage_guards.json
  phase7cr2f2_frozen_guards_sha256: 57aeb3f44569bee0c19c0ea2783b64c479ed0bac7fe83a339415f3484ae110f5
  legacy_phase7c_states:
    15: data/phase7c_multitemperature/initial_states_15c.csv
    30: data/phase7c_multitemperature/initial_states_30c.csv
  legacy_phase7cr1_states: data/phase7cr1_thermal_supervisor/development_initial_states.csv
  legacy_phase7cr2_development_states: data/phase7cr2_temperature_voltage_guards/development_initial_states.csv
  legacy_phase7cr2_internal_states: data/phase7cr2_temperature_voltage_guards/internal_validation_initial_states.csv
  legacy_phase7cr2f_development_states: data/phase7cr2f_teacher_selection_voltage_guard/development_initial_states.csv
  legacy_phase7cr2f_internal_states: data/phase7cr2f_teacher_selection_voltage_guard/internal_validation_initial_states.csv
  legacy_phase7b1_25c_states: data/phase7b1a_voltage_mismatch/confirmation_initial_states.csv

control_contract:
  residual_initialization: measured
  allow_zero_residual_fallback: false
  initial_measurement_horizon_s: 1.0e-9
  sample_period_s: 5.0
  boot_steps: [0, 1]
  running_starts_at_step: 2
  initial_state_history_contract: dfn_and_2rc_do_not_share_current_history
  teacher_selection_frozen: true
  thermal_supervisor_frozen: true
  temperature_30c_architecture_and_guards_frozen: true
  r3_generation_authorized: false
  ann_execution_authorized: false

voltage_guard:
  design: per_temperature_two_stage_boot_and_running
  design_frozen_before_state_generation: true
  engineering_margin_v: 0.0005
  residual_growth_tolerance_v: 1.0e-12
  historical_limits:
    15:
      boot_v: 0.0366612309890537
      running_floor_v: 0.014098037646160801
    25:
      boot_v: 0.026040820770421
      previous_guard_v: 0.011305522502741638
      known_running_growth_v: 0.0123420547282164
    30:
      boot_v: 0.0376479265035423
      running_v: 0.0218918472128131
  development_audit_guards:
    15:
      boot_v: 0.0371612309890537
      running_v: 0.014098037646160801
    25:
      boot_v: 0.026540820770421
      running_v: 0.0128420547282164
    30:
      boot_v: 0.0376479265035423
      running_v: 0.0218918472128131
  formula_15_boot: max(historical_15_boot_v, development_15_boot_max_v) + engineering_margin_v
  formula_15_running: max(historical_15_running_floor_v, development_15_running_max_v + engineering_margin_v)
  formula_25_boot: max(historical_25_boot_v, development_25_boot_max_v) + engineering_margin_v
  formula_25_running: max(previous_25_guard_v, known_25_running_growth_v + engineering_margin_v, development_25_running_max_v + engineering_margin_v)
  frozen_30_guard_source: data/phase7cr2f2_two_stage_voltage_guard/frozen_two_stage_voltage_guards.json

datasets:
  development_count_per_temperature: 48
  internal_validation_count_per_temperature: 24
  temperatures_c: [15, 25]
  maximum_workers: 3
  maximum_steps: 1800
  target_soc: 0.7995
  initial_voltage_margin_v: 0.005
  initial_residual_extreme_threshold_v: -0.100
  designs:
    development:
      15: {start_index: 5101, seed: 20260821}
      25: {start_index: 6101, seed: 20260822}
    internal_validation:
      15: {start_index: 7101, seed: 20260823}
      25: {start_index: 8101, seed: 20260824}
  strata:
    development:
      startup_transient_stress: 24
      historical_exceedance_neighborhood: 12
      general_high_risk: 8
      global_coverage: 4
    internal_validation:
      startup_transient_stress: 12
      historical_exceedance_neighborhood: 6
      general_high_risk: 4
      global_coverage: 2
  bounds:
    global_coverage:
      soc: [0.45, 0.70]
      v1_v: [0.0, 0.065]
      v2_v: [0.0, 0.10]
      previous_current_a: [0.0, 10.0]
    general_high_risk:
      soc: [0.54, 0.70]
      v1_v: [0.035, 0.065]
      v2_v: [0.040, 0.10]
      previous_current_a: [6.0, 10.0]
    startup_transient_stress:
      soc: [0.52, 0.69]
      v1_v: [0.040, 0.065]
      v2_v: [0.050, 0.10]
      previous_current_a: [7.0, 10.0]
  neighborhood_half_width:
    soc: 0.015
    v1_v: 0.008
    v2_v: 0.012
    previous_current_a: 0.75
  historical_centers:
    15:
      - source: data/phase7c_multitemperature/initial_states_15c.csv
        trajectory_id: phase7c_15c_006
        evidence: r2f2_15c_maximum_boot_exceedance
      - source: data/phase7cr2_temperature_voltage_guards/development_initial_states.csv
        trajectory_id: phase7cr2_development_15c_005
        evidence: r2f2_15c_development_exceedance
      - source: data/phase7cr2_temperature_voltage_guards/internal_validation_initial_states.csv
        trajectory_id: phase7cr2_internal_validation_15c_000
        evidence: r2f2_15c_internal_exceedance
    25:
      - source: data/phase7b1a_voltage_mismatch/confirmation_initial_states.csv
        trajectory_id: phase7b1_confirm_012
        evidence: r2f2_25c_maximum_boot_exceedance
      - source: data/phase7b1a_voltage_mismatch/confirmation_initial_states.csv
        trajectory_id: phase7b1_confirm_003
        evidence: r2f2_25c_known_running_exceedance
      - source: data/phase7b1a_voltage_mismatch/confirmation_initial_states.csv
        trajectory_id: phase7b1_confirm_015
        evidence: r2f2_25c_running_neighborhood

validation_contract:
  internal_validation_is_one_shot: true
  internal_validation_may_not_modify_guards: true
  failed_internal_validation_becomes_permanent_regression: true
  new_development_not_counted_as_independent_validation: true
  phase7cr2f2_248_trajectories_are_permanent_regression: true
  phase7cr2f2_30c_internal_is_not_new_validation: true
  expected_new_internal_trajectory_count: 48
  expected_historical_regression_trajectory_count: 248
  expected_total_validation_trajectory_count: 296

gates:
  maximum_voltage_v: 4.200001
  maximum_average_temperature_c: 35.0
  maximum_current_a: 10.0
  minimum_current_a: 0.0
  maximum_current_step_a: 2.0
  maximum_per_temperature_boot_guard_exceedance_count: 0
  maximum_per_temperature_running_guard_exceedance_count: 0
  maximum_all_temperature_guard_exceedance_count: 0
  maximum_empty_interval_count: 0
  maximum_solver_failure_count: 0
  maximum_strict_teacher_failure_count: 0
  maximum_prediction_infeasible_count: 0
  maximum_sustained_oscillation_count: 0
  maximum_zero_residual_initialization_count: 0
  minimum_target_reach_fraction: 1.0
  numerical_tolerance: 1.0e-9

output:
  data_directory: data/phase7cr2f3_temperature_two_stage_guards
  result_directory: outputs/phase7cr2f3_temperature_two_stage_guards
