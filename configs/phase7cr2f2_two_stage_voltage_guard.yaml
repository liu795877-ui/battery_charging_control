study:
  name: phase7cr2f2_two_stage_voltage_guard
  phase: Phase 7C-R2F2
  contract_status: preregistered_before_new_state_generation

sources:
  phase7cr2f_config: configs/phase7cr2f_teacher_selection_voltage_guard.yaml
  phase7cr2f_freeze_manifest: outputs/phase7cr2f_teacher_selection_voltage_guard/freeze_manifest.json
  phase7cr2f_freeze_manifest_sha256: 5df4eae4f839385699bc0d76ec49ba765b1d60fe93092864418544ea57bd49be
  residual_audit_config: configs/phase7cr2f2_residual_initialization_audit.yaml
  residual_audit_freeze_manifest: outputs/phase7cr2f2_residual_initialization_audit/freeze_manifest.json
  residual_audit_freeze_manifest_sha256: 06f756924a490a2cb68880f1869cef1ff0bddbcf9609cc9afc3cfeae9b5f6df1
  residual_audit_initial_states: data/phase7cr2f2_residual_initialization_audit/initial_voltage_audit.csv
  legacy_phase7c_states:
    15: data/phase7c_multitemperature/initial_states_15c.csv
    30: data/phase7c_multitemperature/initial_states_30c.csv
  legacy_phase7cr1_states: data/phase7cr1_thermal_supervisor/development_initial_states.csv
  legacy_phase7cr2_development_states: data/phase7cr2_temperature_voltage_guards/development_initial_states.csv
  legacy_phase7cr2_internal_states: data/phase7cr2_temperature_voltage_guards/internal_validation_initial_states.csv
  legacy_phase7cr2f_development_states: data/phase7cr2f_teacher_selection_voltage_guard/development_initial_states.csv
  legacy_phase7cr2f_internal_states: data/phase7cr2f_teacher_selection_voltage_guard/internal_validation_initial_states.csv
  legacy_phase7b1_25c_states: data/phase7b1a_voltage_mismatch/confirmation_initial_states.csv

control_contract:
  residual_initialization: measured
  allow_zero_residual_fallback: false
  initial_measurement_horizon_s: 1.0e-9
  sample_period_s: 5.0
  boot_steps: [0, 1]
  running_starts_at_step: 2
  initial_state_history_contract: dfn_and_2rc_do_not_share_current_history
  teacher_selection_frozen: true
  thermal_supervisor_frozen: true
  temperature_15c_guard_frozen: true
  temperature_25c_guard_frozen: true
  r3_generation_authorized: false
  ann_execution_authorized: false

voltage_guard:
  design: two_stage_boot_and_running
  design_frozen_before_state_generation: true
  guard_15c_v: 0.014098037646160801
  guard_25c_v: 0.011305522502741638
  boot_historical_minimum_30c_v: 0.03443951909904808
  running_guard_floor_30c_v: 0.0218918472128131
  engineering_margin_v: 0.0005
  development_audit_boot_guard_30c_v: 0.03493951909904808
  development_audit_running_guard_30c_v: 0.0218918472128131
  residual_growth_tolerance_v: 1.0e-12
  formula_boot: max(boot_historical_minimum_30c_v, development_boot_max_v) + engineering_margin_v
  formula_running: max(running_guard_floor_30c_v, development_running_max_v + engineering_margin_v)

datasets:
  temperature_c: 30.0
  development_count: 48
  internal_validation_count: 24
  development_design_start_index: 3101
  internal_validation_design_start_index: 4101
  development_seed: 20260811
  internal_validation_seed: 20260812
  maximum_workers: 3
  maximum_steps: 1800
  target_soc: 0.7995
  initial_voltage_margin_v: 0.005
  initial_residual_extreme_threshold_v: -0.150
  strata:
    development:
      startup_transient_stress: 24
      historical_extreme_neighborhood: 12
      general_high_risk: 8
      global_coverage: 4
    internal_validation:
      startup_transient_stress: 12
      historical_extreme_neighborhood: 6
      general_high_risk: 4
      global_coverage: 2
  bounds:
    global_coverage:
      soc: [0.45, 0.70]
      v1_v: [0.0, 0.065]
      v2_v: [0.0, 0.10]
      previous_current_a: [0.0, 10.0]
    general_high_risk:
      soc: [0.56, 0.70]
      v1_v: [0.035, 0.065]
      v2_v: [0.045, 0.10]
      previous_current_a: [6.0, 10.0]
    startup_transient_stress:
      soc: [0.55, 0.68]
      v1_v: [0.045, 0.065]
      v2_v: [0.055, 0.10]
      previous_current_a: [7.0, 10.0]
  neighborhood_half_width:
    soc: 0.015
    v1_v: 0.008
    v2_v: 0.012
    previous_current_a: 0.75
  historical_centers:
    - source: data/phase7cr2f_teacher_selection_voltage_guard/development_initial_states.csv
      trajectory_id: phase7cr2f_development_30c_017
      evidence: residual_audit_lower_bound
    - source: data/phase7cr2f_teacher_selection_voltage_guard/development_initial_states.csv
      trajectory_id: phase7cr2f_development_30c_013
      evidence: residual_audit_boot_growth_maximum
    - source: data/phase7cr2f_teacher_selection_voltage_guard/internal_validation_initial_states.csv
      trajectory_id: phase7cr2f_internal_validation_30c_014
      evidence: r2f_25_001527_mv_exceedance
    - source: data/phase7cr2_temperature_voltage_guards/internal_validation_initial_states.csv
      trajectory_id: phase7cr2_internal_validation_30c_000
      evidence: r2_historical_exceedance
    - source: data/phase7c_multitemperature/initial_states_30c.csv
      trajectory_id: phase7c_30c_012
      evidence: phase7c_historical_exceedance
    - source: data/phase7cr1_thermal_supervisor/development_initial_states.csv
      trajectory_id: phase7cr1_dev_001
      evidence: r1_historical_exceedance

validation_contract:
  internal_validation_is_one_shot: true
  internal_validation_may_not_modify_guards: true
  failed_internal_validation_becomes_permanent_regression: true
  rerun_development_with_frozen_guards: true
  include_all_historical_regressions: true
  include_25c_confirmation_as_regression_only: true

gates:
  maximum_voltage_v: 4.200001
  maximum_average_temperature_c: 35.0
  maximum_current_a: 10.0
  minimum_current_a: 0.0
  maximum_current_step_a: 2.0
  maximum_boot_guard_exceedance_count: 0
  maximum_running_guard_exceedance_count: 0
  maximum_empty_interval_count: 0
  maximum_solver_failure_count: 0
  maximum_strict_teacher_failure_count: 0
  maximum_prediction_infeasible_count: 0
  maximum_sustained_oscillation_count: 0
  maximum_zero_residual_initialization_count: 0
  minimum_target_reach_fraction: 1.0
  numerical_tolerance: 1.0e-9

output:
  data_directory: data/phase7cr2f2_two_stage_voltage_guard
  result_directory: outputs/phase7cr2f2_two_stage_voltage_guard
