study:
  name: chen2020_phase6r_corrected_policy_distillation
  random_seed: 20260724

source_phase3_config: configs/phase3.yaml

teacher_data:
  initial_trajectory_count: 240
  trajectory_steps: 8
  train_fraction: 0.70
  validation_fraction: 0.15
  checkpoint_interval_trajectories: 5
  initial_state_ranges:
    state_soc: [0.10, 0.75]
    state_polarization_fast_v: [0.00, 0.09]
    state_polarization_slow_v: [0.00, 0.09]
    state_core_temperature_c: [25.0, 33.4]
    state_surface_temperature_c: [25.0, 33.4]
    state_previous_current_a: [0.0, 10.0]
  minimum_teacher_acceptance_fraction: 0.70
  consistency_state_count: 3
  consistency_steps_per_state: 3
  consistency_tolerance_a: 1.0e-6

network:
  hidden_layer_sizes: [32, 32, 16]
  activation: tanh
  regularization_alpha: 0.001
  initialization_seeds: [22, 42, 73]
  maximum_iterations: 2500
  convergence_tolerance: 1.0e-8
  learning_rate_init: 0.001
  no_improvement_iterations: 100

validation:
  current_nrmse_normalization_a: 10.0
  maximum_offline_nrmse: 0.01
  maximum_reduced_closed_loop_nrmse: 0.01
  maximum_dfn_closed_loop_nrmse: 0.01
  maximum_charge_time_gap_fraction: 0.02
  minimum_inference_speedup_over_mpc: 100.0
  maximum_voltage_violation_v: 0.01
  maximum_temperature_violation_c: 0.10
  maximum_current_violation_a: 0.10
  maximum_current_change_violation_a: 0.20
  maximum_simulation_time_s: 3600.0
