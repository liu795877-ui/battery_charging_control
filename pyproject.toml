[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-fast-charge-control"
version = "0.2.0"
description = "Constrained battery fast-charging simulation with Chen2020, reduced models, MPC and ANN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pybamm==26.6.2.0",
  "matplotlib>=3.10",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.15",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.4",
  "nbclient>=0.10",
  "pytest>=8.3",
]
ann = [
  "scikit-learn>=1.7",
]

[project.scripts]
battery-phase1 = "battery_fast_charge.cli:main"
battery-phase2 = "battery_fast_charge.phase2_cli:main"
battery-phase3 = "battery_fast_charge.phase3_cli:main"
battery-phase3b = "battery_fast_charge.phase3b_cli:main"
battery-phase4a = "battery_fast_charge.phase4_cli:main"
battery-phase4b = "battery_fast_charge.phase4b_cli:main"
battery-phase4b2 = "battery_fast_charge.phase4b2_cli:main"
battery-phase5a = "battery_fast_charge.phase5a_cli:main"
battery-phase6 = "battery_fast_charge.phase6_cli:main"
battery-phase6b = "battery_fast_charge.phase6b_cli:main"
battery-phase6c1 = "battery_fast_charge.phase6c1_cli:main"
battery-phase6c2 = "battery_fast_charge.phase6c2_cli:main"
battery-phase6c3 = "battery_fast_charge.phase6c3_cli:main"
battery-phase6r-teacher = "battery_fast_charge.phase6r_teacher_cli:main"
battery-phase6r-train = "battery_fast_charge.phase6r_training_cli:main"
battery-phase6r-validate = "battery_fast_charge.phase6r_validation_cli:main"
battery-phase5b0 = "battery_fast_charge.phase5b0_cli:main"
battery-phase5b05 = "battery_fast_charge.phase5b05_cli:main"
battery-phase5b06 = "battery_fast_charge.phase5b06_cli:main"
battery-phase6p0 = "battery_fast_charge.phase6p0_cli:main"
battery-phase2r = "battery_fast_charge.phase2r_cli:main"
battery-phase2rc = "battery_fast_charge.phase2rc_cli:main"
battery-phase2rd = "battery_fast_charge.phase2rd_cli:main"
battery-phase7a-level1 = "battery_fast_charge.phase7a_level1_cli:main"
battery-phase7a-level1r = "battery_fast_charge.phase7a_level1r_cli:main"
battery-phase7a-level1s = "battery_fast_charge.phase7a_level1s_cli:main"
battery-phase7a-level2 = "battery_fast_charge.phase7a_level2_cli:main"
battery-phase7a-level3 = "battery_fast_charge.phase7a_level3_cli:main"
battery-phase7a-level3p = "battery_fast_charge.phase7a_level3p_cli:main"
